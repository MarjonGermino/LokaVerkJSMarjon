<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokaverkefni JS_Tskoli (Marjón)</title>
    <link rel="stylesheet" href="changes/css.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="changes/js.js" defer></script>
    <div class="cardRows">
        <div class="cardTemplate">
            <hr>

            <p id="street">Street</p>
            <p id="postalCode">(postalCode)</p>
            <p id="number">(Numb)</p>
            <p id="isApartment">(isApartment)</p>
            <p id="location">(location) #based on lat&lng</p>
            <p id="candyAlergyies">(candyAlergyies) #nut/dairyFree?</p>
            <p id="time">(time)</p>
            <img src="img/demo_cat.png" alt="">

            <hr>
        </div>
    </div>
    <div class="filters">
        <div>
            <input
            type="range" id="listRange"
            min="0" max="100"
            value="100" step="5"/>
            <output></output>
        </div>
        <div>
            <label>
                <input type="checkbox" role="switch" id="nutFree">
                Nut free
            </label>
        </div>
        <div>
            <label>
                <input type="checkbox" role="switch" id="dairyFree">
                dairy free
            </label>
        </div>

            
        </script>
        <div class="times">
            <input id="fra" aria-label="Frá">
            <input id="til" aria-label="Til">
        </div>


    </div>
    
</body>
</html>
